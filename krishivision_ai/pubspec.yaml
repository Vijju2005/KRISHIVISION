name: krishivision_ai
description: "KrishiVision - Smart Crop Monitoring Using Satellite Images"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  dio: ^5.4.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  pdf: ^3.10.8
  open_filex: ^4.5.0
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  share_plus: ^9.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#0F5132"
  adaptive_icon_foreground: "assets/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/splash_bg.png
    - assets/app_logo.png
